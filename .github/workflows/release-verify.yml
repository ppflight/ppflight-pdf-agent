name: Release verification

concurrency:
  group: pdf-agent-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version to validate
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Python release tests
        run: |
          python -m compileall -q agent.py pdf_agent scripts
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, gd
          tools: composer:v2
      - name: Validate dependencies and render a real invoice
        run: |
          composer validate --working-dir=renderer --strict --no-check-publish
          composer install --working-dir=renderer --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts --classmap-authoritative
          composer audit --working-dir=renderer --locked --no-interaction --no-ansi
          php tests/renderer_test.php
      - name: Validate scripts and Nginx examples
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nginx-light openssl
          shellcheck install.sh update.sh rollback.sh uninstall.sh bind.sh ag-pdf pag scripts/*.sh
          ./scripts/verify-nginx-config.sh
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Validate release layout and version
        run: ./scripts/verify-release.sh --source . --version '${{ steps.version.outputs.value }}'
      - name: Build and verify immutable release assets
        run: |
          archive="ppflight-pdf-agent-${{ steps.version.outputs.value }}.tar.gz"
          prefix="ppflight-pdf-agent-${{ steps.version.outputs.value }}/"
          git archive --format=tar.gz --prefix="$prefix" --output="$archive" HEAD
          python3 scripts/verify-release-archive.py "$archive"
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check "$archive.sha256"
      - name: Publish GitHub Release for immutable tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          archive="ppflight-pdf-agent-${VERSION}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists; immutable assets will not be replaced" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --title "PPFlight PDF Agent ${VERSION}" \
            --notes "PPFlight PDF Agent ${VERSION}。安装前请校验随附的 SHA-256 文件。"
