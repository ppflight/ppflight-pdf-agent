name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q agent.py pdf_agent scripts
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, gd
          tools: composer:v2
      - name: Check required extensions and Composer metadata
        run: |
          php -m | grep -Fx mbstring
          php -m | grep -Fx xml
          php -m | grep -Fx gd
          composer validate --working-dir=renderer --strict --no-check-publish
          composer install --working-dir=renderer --no-dev --prefer-dist --no-interaction --no-progress --no-plugins --no-scripts --classmap-authoritative
          composer audit --working-dir=renderer --locked --no-interaction --no-ansi
      - name: Lint PHP source
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l
      - name: Render a real invoice PDF
        run: |
          php tests/renderer_test.php
          python3 -W error::ResourceWarning -m unittest tests.test_agent_core.AgentCoreTests.test_fixed_renderer_writes_a_real_ppflight_prefixed_pdf -v

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install ShellCheck and Nginx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck nginx-light openssl
      - name: Check operational scripts
        run: shellcheck install.sh update.sh rollback.sh uninstall.sh bind.sh ag-pdf pag scripts/*.sh
      - name: Validate Nginx publication examples
        run: ./scripts/verify-nginx-config.sh

  release-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate packaging security invariants
        run: ./scripts/verify-release.sh --source .
